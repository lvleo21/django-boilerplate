[tool.poetry]
name = "django-boilerplate"
version = "0.1.0"
description = "Este projeto de boilerplate em Django fornece uma estrutura básica para o desenvolvimento de aplicações web. Ele inclui a configuração inicial de banco de dados, autenticação de usuário, administração, etc."
authors = ["Leonardo Veras <verasleonardo210@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.13"
django = "^5.1.1"
django-environ = "^0.11.2"
djangorestframework = "^3.15.2"
django-filter = "^24.3"
drf-yasg = "^1.21.7"
django-rosetta = "^0.10.1"
setuptools = "^66.1.1"
gunicorn = "^23.0.0"
django-storages = "^1.14.6"
boto3 = "^1.40.67"
celery = "^5.5.3"
redis = "^7.0.1"
django-celery-beat = "^2.8.1"
psycopg2-binary = "^2.9.11"
flower = "^2.0.1"
inertia-django = "^2.0.0"
django-vite = "^3.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-django = "^4.9.0"
ruff = "^0.16.10"

[tool.poetry.group.dev]
optional = true

[tool.ruff]
target-version = "py313"
line-length = 88
# O Django vive em backend/: os imports first-party são `apps` e `config`.
src = ["backend"]
# Migrations são geradas pelo Django.
extend-exclude = [".agents", ".claude", "frontend", "**/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "DJ",   # flake8-django
    "INT",  # flake8-gettext: sem f-string/format dentro de _() (ver regras de i18n)
]
# Tamanho de linha é trabalho do formatter; strings longas que ele não quebra
# ficam como estão.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Settings por ambiente herdam tudo de base.py com `import *`.
"backend/config/settings/{local,prod}.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
pythonpath = ["backend"]
python_files = ["test*.py", "*.p_testy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
