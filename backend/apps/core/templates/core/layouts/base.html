{% load django_vite i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% vite_hmr_client %}
    {% vite_react_refresh %}

</head>

<body>
    {% block inertia %}{% endblock inertia %}
</body>

</html>
